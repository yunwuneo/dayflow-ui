name: Dayflow
options:
  bundleIdPrefix: app.dayflow
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
targets:
  Dayflow:
    type: application
    platform: iOS
    sources: [Dayflow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayflow.archive
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dayflow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网中的 Dayflow 档案服务器。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Dayflow/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  DayflowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DayflowTests]
    dependencies:
      - target: Dayflow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DayflowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DayflowUITests]
    dependencies:
      - target: Dayflow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dayflow:
    build:
      targets:
        Dayflow: all
    test:
      targets: [DayflowTests, DayflowUITests]
