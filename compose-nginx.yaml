services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_DB: dayflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dayflow -d dayflow']
      interval: 10s
      timeout: 5s
      retries: 10
  storage-init:
    build: .
    user: root
    command: [sh, -c, 'chown node:node /app/storage && chmod u+rwx /app/storage']
    volumes:
      - ./data/screenshots:/app/storage
    restart: 'no'
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4310:4310"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      STORAGE_DIR: /app/storage
      TRUST_PROXY: 'true'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SYNC_TOKEN: ${SYNC_TOKEN:?Set SYNC_TOKEN}
      READ_API_TOKEN: ${READ_API_TOKEN:-}
      NOTION_ENABLED: ${NOTION_ENABLED:-false}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_ENCRYPTION_KEY: ${NOTION_ENCRYPTION_KEY:-}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-}
      NOTION_TEMPLATE_URL: ${NOTION_TEMPLATE_URL:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OWNER_USERNAME: ${MCP_OWNER_USERNAME:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_NAME: ${MCP_OAUTH_CLIENT_NAME:-}
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ACCESS_TOKEN_SECONDS: ${MCP_OAUTH_ACCESS_TOKEN_SECONDS:-3600}
      MCP_OAUTH_GRANT_SECONDS: ${MCP_OAUTH_GRANT_SECONDS:-2592000}
      MCP_OAUTH_CODE_SECONDS: ${MCP_OAUTH_CODE_SECONDS:-120}
      CASDOOR_ORIGIN: ${CASDOOR_ORIGIN:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_REDIRECT_URI: ${CASDOOR_REDIRECT_URI:-}
    volumes:
      - ./data/screenshots:/app/storage
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
